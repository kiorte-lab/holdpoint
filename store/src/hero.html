<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1440px;height:720px;overflow:hidden;font-family:Inter,Roboto,sans-serif;color:#fff;
 background:radial-gradient(circle at 1080px 380px,rgba(217,119,87,.28),rgba(217,119,87,0) 420px),
 radial-gradient(circle at 200px 700px,rgba(47,191,113,.10),rgba(0,0,0,0) 500px),#0d0f14;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 900px 360px,#000,transparent 75%)}
.copy{position:absolute;left:96px;top:160px;width:540px}
.kicker{font-size:22px;font-weight:600;letter-spacing:.14em;color:#D97757;text-transform:uppercase}
h1{font-family:'Inter Display',Inter;font-size:74px;line-height:1;font-weight:700;margin-top:18px;letter-spacing:-.02em}
h1 span{color:#D97757}
p{font-size:28px;line-height:1.4;color:#a9afbd;margin-top:26px}
.chips{display:flex;gap:14px;margin-top:38px}
.chip{font-size:22px;font-weight:600;padding:10px 22px;border-radius:999px;border:2px solid}
.ok{color:#2FBF71;border-color:rgba(47,191,113,.55);background:rgba(47,191,113,.08)}
.no{color:#E5484D;border-color:rgba(229,72,77,.55);background:rgba(229,72,77,.08)}
.re{color:#D97757;border-color:rgba(217,119,87,.55);background:rgba(217,119,87,.08)}
/* terminal */
.term{position:absolute;left:668px;top:92px;width:330px;border-radius:14px;background:#161a22;border:1px solid #2a303c;box-shadow:0 30px 60px rgba(0,0,0,.5);font-family:'DejaVu Sans Mono',monospace;font-size:17px;opacity:.92}
.bar{height:36px;border-bottom:1px solid #2a303c;display:flex;align-items:center;gap:8px;padding-left:16px}
.bar i{width:12px;height:12px;border-radius:50%;background:#3a404c;display:block}
.bar b{font-family:Inter;font-weight:500;font-size:14px;color:#6c7383;margin-left:12px}
.tb{padding:18px 20px 22px;line-height:1.75;color:#c9ced8}
.dim{color:#5f6676}.or{color:#D97757}.gr{color:#2FBF71}
.box{border:1px solid #D97757;border-radius:8px;padding:10px 14px;margin-top:10px;background:rgba(217,119,87,.06)}
/* link */
svg.link{position:absolute;left:0;top:0}
/* watch */
.watch{position:absolute;left:880px;top:0;width:440px;height:720px}
.strap{position:absolute;left:105px;width:230px;background:linear-gradient(90deg,#1b1e25,#2a2e37 50%,#1b1e25);}
.s1{top:-20px;height:200px;border-radius:0 0 40px 40px}
.s2{bottom:-20px;height:200px;border-radius:40px 40px 0 0}
.s1:after,.s2:after{content:"";position:absolute;left:30px;right:30px;top:20px;bottom:20px;border-left:2px dashed rgba(255,255,255,.05);border-right:2px dashed rgba(255,255,255,.05)}
.case{position:absolute;left:30px;top:170px;width:380px;height:380px;border-radius:50%;
 background:conic-gradient(from 210deg,#5c6270,#2b2f38,#8a909c,#2b2f38,#5c6270);box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.08)}
.bezel{position:absolute;inset:16px;border-radius:50%;background:#0b0c0f;box-shadow:inset 0 0 0 2px #23262e}
.tick{position:absolute;left:50%;top:50%;width:3px;height:10px;background:#3a3f4a;transform-origin:50% 0}
.screen{position:absolute;inset:34px;border-radius:50%;overflow:hidden;background:#000}
.screen img{width:100%;height:100%;display:block;transform:scale(1.02)}
.glare{position:absolute;inset:34px;border-radius:50%;background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,0) 45%)}
.btn{position:absolute;width:18px;height:46px;border-radius:6px;background:linear-gradient(90deg,#3d424d,#6b717e)}
.foot{position:absolute;left:96px;bottom:54px;font-size:18px;color:#5f6676}

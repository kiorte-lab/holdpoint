name = "holdpoint-relay"
main = "worker/index.js"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false
# Public address. The old workers.dev address stays on so older installs keep working.
routes = [{ pattern = "holdpoint.kiorte.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

